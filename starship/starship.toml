"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────
add_newline = true

# Dòng trên: [Thư mục] [Git] --------khoảng trống-------- [C++] [Python] [Mise] [Thời gian]
# Dòng dưới: ❯
format = """
$directory\
$git_branch\
$git_status\
$mise\
$fill\
$all\
$cmd_duration\
$line_break\
$character"""

# ─────────────────────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────────────────────
[directory]
read_only = " 󰌾"
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

# ─────────────────────────────────────────────────────────────
# Git (Giữ nguyên bộ icon cực ngầu của bạn)
# ─────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ─────────────────────────────────────────────────────────────
# Prompt Character
# ─────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────────────────────
# Layout & Performance
# ─────────────────────────────────────────────────────────────
[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = " [⏱ $duration](dimmed white)"
